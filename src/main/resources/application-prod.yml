# BGSI-326 / BGSI-328: production (SPRING_PROFILES_ACTIVE=prod).
# Every value comes from environment variables, never from the code.
# Supabase (PostgreSQL): see docs/supabase.md
spring:
  datasource:
    # e.g. jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # The free plan of Supabase allows few connections: a small pool is enough for this website
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      # validate: checks that the tables match the entities and never changes them.
      # Only the first start on an empty database: DDL_AUTO=update (it creates the tables)
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        # Supabase publishes the "public" schema through its REST API (Data API).
        # Our tables go to their own schema (DB_SCHEMA=app) so only this API can read them
        default_schema: ${DB_SCHEMA:public}
        # Creates that schema the first time (with DDL_AUTO=update)
        "[hbm2ddl.create_namespaces]": true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: warn
    com.bgsistemas: info
